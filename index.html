<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>英会話用単語1000本ノック</title>
  <style>
    :root{
      --bg:#0b0f17; --card:#111827; --card2:#0f172a;
      --fg:#e8eaee; --muted:#a7b0c0; --line:rgba(255,255,255,.10);
      --accent:#22c55e; --blue:#2563eb; --warn:#f59e0b; --danger:#b91c1c;
    }

    /* 横スクロール根絶 */
    html, body{
      width:100%;
      max-width:100%;
      overflow-x:hidden !important;
      overscroll-behavior-x:none;
      touch-action: pan-y;
      -webkit-text-size-adjust:100%;
    }
    @supports (overflow: clip){
      html, body{ overflow-x: clip !important; }
    }
    *, *::before, *::after{
      box-sizing:border-box;
      max-width:100%;
      min-width:0;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background:var(--bg);
      color:var(--fg);
    }

    a, button, .choice{
      color: var(--fg) !important;
      -webkit-text-fill-color: var(--fg);
      text-decoration:none;
    }
    button{
      appearance:none; -webkit-appearance:none;
      -webkit-tap-highlight-color: transparent;
      margin:0;
    }

    .app{
      width:100%;
      min-height:100vh;
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
      contain: layout paint;
      overflow:hidden; /* 最終保険 */
    }

    .topbar{
      width:100%;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      gap:10px;
      overflow:hidden;
      contain: paint;
    }

    /* ★ vwを完全撤去：ここが横はみ出しの原因になりやすい */
    .titleBox{
      flex: 1 1 auto;
      min-width:0;
      overflow:hidden;
    }
    .title{
      margin:0;
      font-size:16px;
      font-weight:900;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .status{
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .btn{
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--card2);
      padding: 8px 10px;
      font-size:13px;
      min-height: 36px;
      cursor:pointer;
      user-select:none;
      flex: 0 0 auto;
    }
    .btn.primary{ background:#16a34a; border-color:#16a34a; }
    .btn.blue{ background:var(--blue); border-color:var(--blue); }
    .btn.ghost{ background:transparent; }
    .btn.danger{ background:var(--danger); border-color:var(--danger); }

    .hamburger{
      width: 36px;
      height: 36px;
      padding: 7px;
      display:grid; place-items:center;
      flex: 0 0 36px;
    }
    .hamburger span{
      width:18px; height:2px; background:var(--fg); border-radius:10px; position:relative;
      display:block;
    }
    .hamburger span::before,
    .hamburger span::after{
      content:""; position:absolute; left:0; width:18px; height:2px; background:var(--fg); border-radius:10px;
    }
    .hamburger span::before{ top:-6px; }
    .hamburger span::after{ top:6px; }

    .main{
      width:100%;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow:hidden;
      contain: layout paint;
    }

    .label{ font-size:11px; color:var(--muted); }
    .prompt{
      font-size:26px;
      font-weight:950;
      line-height:1.08;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    /* 解答前の4択：伸びない＆小さい */
    .choices{
      width:100%;
      display:grid;
      gap:6px;
      flex: 0 0 auto;              /* 伸ばさない */
      align-content: start;         /* 余白を配らない */
      grid-auto-rows: min-content;  /* 行の高さは内容分 */
      overflow:hidden;
      contain: paint;
    }
    .choice{
      display:block;
      width:100%;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 12.5px;
      line-height: 1.10;
      text-align:left;
      word-break: break-word;
      overflow-wrap:anywhere;
      overflow:hidden;
    }
    .choice:focus{ outline:none; }
    .choice:active{ transform: translateY(1px); }

    /* 解答後（現状の良いレイアウト維持） */
    .answer{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
      padding: 10px 12px;
      display:none;
      overflow:hidden;
    }
    .answerTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:6px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 5px 9px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-size:11px;
      white-space:nowrap;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .dot{ width:8px; height:8px; border-radius:999px; background: var(--blue); }
    .dot.green{ background: var(--accent); }
    .dot.warn{ background: var(--warn); }
    .k{ font-size:11px; color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    .answerBlock{
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap:anywhere;
    }
    .answerBlock b{ font-size: 14px; }

    /* ★ボタン横はみ出し保険：width固定 */
    .bottomActions{
      width:100%;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:2px;
      overflow:hidden;
    }
    .bottomActions .btn{ width:100%; }

    /* Drawer */
    .drawerOverlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      z-index: 50;
    }
    .drawer{
      position:fixed;
      top: 10px; right: 10px;
      width: min(340px, calc(100% - 20px));
      max-width: calc(100% - 20px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      z-index: 60;
      display:none;
      overflow:hidden;
      contain: paint;
    }
    .drawer h2{ margin:0 0 10px; font-size:14px; font-weight:900; }
    .drawer .k{ margin-bottom:6px; display:block; }
    .drawer select{
      width:100%;
      border-radius:12px;
      border:1px solid var(--line);
      background: var(--card2);
      color: var(--fg);
      padding: 8px 10px;
      min-height: 36px;
      font-size: 13px;
    }
    .drawer .btn{ width:100%; margin-top:10px; }

    @media (max-height: 690px){
      .prompt{ font-size:24px; }
      .choice{ padding: 6px 9px; font-size: 12px; }
      .btn{ min-height: 34px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="titleBox">
        <h1 class="title">英会話用単語1000本ノック</h1>
        <div class="status" id="statusText">読み込み中…</div>
      </div>
      <button class="btn hamburger" id="btnMenu" aria-label="menu"><span></span></button>
    </div>

    <div class="main">
      <div class="label">問題（英→日）</div>
      <div class="prompt" id="prompt">—</div>

      <div class="choices" id="choices"></div>

      <div class="answer" id="answer"></div>

      <div class="bottomActions">
        <button class="btn primary" id="btnNext">次へ</button>
        <button class="btn blue" id="btnToggleReview" disabled>復習へ</button>
      </div>
    </div>
  </div>

  <div class="drawerOverlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <h2>メニュー</h2>

    <span class="k">出題モード</span>
    <select id="mode">
      <option value="all">全体</option>
      <option value="review">要復習</option>
      <option value="unseen">未出題</option>
    </select>

    <button class="btn ghost" id="btnClearReview">復習リスト全解除</button>
    <button class="btn danger" id="btnResetSeen">未出題をリセット</button>
    <button class="btn ghost" id="btnCloseMenu">閉じる</button>
  </div>

<script>
(() => {
  const CSV_URLS = [
    "vocab_001_200.csv",
    "vocab_201_400.csv",
    "vocab_401_600.csv",
    "vocab_601_800.csv",
    "vocab_801_1000.csv",
  ];
  const KEY_REVIEW = "vocab_review_ids_v1";
  const KEY_SEEN   = "vocab_seen_ids_v1";

  let items = [];
  let current = null;

  const el = (id) => document.getElementById(id);

  function loadSet(key){
    try{
      const arr = JSON.parse(localStorage.getItem(key) || "[]");
      return new Set(Array.isArray(arr) ? arr : []);
    }catch{ return new Set(); }
  }
  function saveSet(key, set){
    localStorage.setItem(key, JSON.stringify(Array.from(set)));
  }
  const getReviewSet = () => loadSet(KEY_REVIEW);
  const getSeenSet = () => loadSet(KEY_SEEN);

  function parseCSV(text) {
    const rows = [];
    let i = 0, field = "", row = [];
    let inQuotes = false;
    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        } else { field += c; i++; continue; }
      } else {
        if (c === '"') { inQuotes = true; i++; continue; }
        if (c === ",") { row.push(field); field=""; i++; continue; }
        if (c === "\r") { i++; continue; }
        if (c === "\n") { row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
        field += c; i++; continue;
      }
    }
    row.push(field); rows.push(row);
    return rows;
  }
  function norm(h){ return (h||"").trim().toLowerCase(); }
  function rowsToItems(rows){
    if(!rows.length) return [];
    const header = rows[0].map(norm);
    const idx = {
      id: header.indexOf("id"),
      expression: header.indexOf("expression"),
      meaning: header.indexOf("meaning"),
      example_en: header.indexOf("example_en"),
      example_ja: header.indexOf("example_ja"),
    };
    for(const k in idx){ if(idx[k] === -1) throw new Error("CSVヘッダー不足: " + k); }

    const out = [];
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(row.length === 1 && row[0].trim() === "") continue;
      const id = Number(row[idx.id]);
      if(!Number.isFinite(id)) continue;
      out.push({
        id,
        expression: (row[idx.expression] ?? "").trim(),
        meaning: (row[idx.meaning] ?? "").trim(),
        example_en: (row[idx.example_en] ?? "").trim(),
        example_ja: (row[idx.example_ja] ?? "").trim(),
      });
    }
    return out;
  }
  async function fetchCSV(url){
    const res = await fetch(url, { cache:"no-store" });
    if(!res.ok) throw new Error(`CSV取得失敗: ${url} (${res.status})`);
    const text = await res.text();
    return rowsToItems(parseCSV(text));
  }

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildChoices(correct){
    const choices = new Set([correct.meaning]);
    while(choices.size < 4){
      const cand = items[Math.floor(Math.random()*items.length)];
      if(cand?.meaning && cand.meaning !== correct.meaning) choices.add(cand.meaning);
    }
    return shuffle(Array.from(choices));
  }

  function pickItem(){
    if(!items.length) return null;
    const mode = el("mode").value;
    const review = getReviewSet();
    const seen = getSeenSet();

    let pool = items;
    if(mode === "review"){
      pool = items.filter(x => review.has(x.id));
      if(!pool.length) return null;
    } else if(mode === "unseen"){
      pool = items.filter(x => !seen.has(x.id));
      if(!pool.length) return null;
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function setStatus(text){ el("statusText").textContent = text; }

  function updateStatusLine(){
    const review = getReviewSet();
    const seen = getSeenSet();
    const total = items.length;
    const unseen = Math.max(0, total - seen.size);
    setStatus(`読み込み:${total} / 要復習:${review.size} / 未出題:${unseen}`);
  }

  function refreshReviewButton(){
    const btn = el("btnToggleReview");
    if(!current){ btn.disabled = true; btn.textContent = "復習へ"; return; }
    btn.disabled = false;
    const review = getReviewSet();
    const inList = review.has(current.id);
    btn.textContent = inList ? "復習OFF" : "復習へ";
  }

  function escapeHTML(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function renderQuestion(){
    current = pickItem();

    el("answer").style.display = "none";
    el("answer").innerHTML = "";
    el("choices").style.display = "grid";
    el("choices").innerHTML = "";

    if(!current){
      const mode = el("mode").value;
      el("prompt").textContent =
        mode === "review" ? "要復習が空です" :
        mode === "unseen" ? "未出題がありません" : "出題できません";
      refreshReviewButton();
      return;
    }

    const seen = getSeenSet();
    seen.add(current.id);
    saveSet(KEY_SEEN, seen);

    el("prompt").textContent = current.expression;

    const choices = buildChoices(current);
    for(const ch of choices){
      const b = document.createElement("button");
      b.className = "choice";
      b.type = "button";
      b.textContent = ch;
      b.onclick = () => showAnswer(ch === current.meaning);
      el("choices").appendChild(b);
    }

    refreshReviewButton();
    updateStatusLine();
    window.scrollTo({ top:0, left:0, behavior:"auto" });
  }

  function showAnswer(isCorrect){
    el("choices").style.display = "none";

    const review = getReviewSet();
    const inList = current ? review.has(current.id) : false;

    el("answer").style.display = "block";
    el("answer").innerHTML = `
      <div class="answerTop">
        <span class="badge"><span class="dot ${isCorrect ? "green" : "warn"}"></span>${isCorrect ? "正解" : "間違い"}</span>
        <span class="badge"><span class="dot"></span>${inList ? "要復習:ON" : "要復習:OFF"}</span>
        <span class="badge k">ID:<span class="mono">${current.id}</span></span>
      </div>

      <div class="answerBlock">
        <span class="k">答え</span><br>
        <b>${escapeHTML(current.expression)}</b> — ${escapeHTML(current.meaning)}
      </div>

      <div class="answerBlock">
        <span class="k">例文（EN）</span><br>${escapeHTML(current.example_en)}
      </div>

      <div class="answerBlock">
        <span class="k">例文（JA）</span><br>${escapeHTML(current.example_ja)}
      </div>
    `;
  }

  function toggleReview(){
    if(!current) return;
    const review = getReviewSet();
    if(review.has(current.id)) review.delete(current.id);
    else review.add(current.id);
    saveSet(KEY_REVIEW, review);
    refreshReviewButton();
    updateStatusLine();
  }

  function clearReview(){
    saveSet(KEY_REVIEW, new Set());
    refreshReviewButton();
    updateStatusLine();
  }

  function resetSeen(){
    saveSet(KEY_SEEN, new Set());
    updateStatusLine();
    if(el("mode").value === "unseen") renderQuestion();
  }

  function openDrawer(){
    el("drawerOverlay").style.display = "block";
    el("drawer").style.display = "block";
  }
  function closeDrawer(){
    el("drawerOverlay").style.display = "none";
    el("drawer").style.display = "none";
  }

  el("btnMenu").onclick = openDrawer;
  el("drawerOverlay").onclick = closeDrawer;
  el("btnCloseMenu").onclick = closeDrawer;

  el("btnNext").onclick = renderQuestion;
  el("btnToggleReview").onclick = toggleReview;

  el("mode").onchange = () => { closeDrawer(); renderQuestion(); };
  el("btnClearReview").onclick = () => { if(confirm("復習リストを全解除します。OK？")) clearReview(); closeDrawer(); };
  el("btnResetSeen").onclick = () => { if(confirm("未出題（出題履歴）をリセットします。OK？")) resetSeen(); closeDrawer(); };

  (async () => {
    try{
      setStatus("読み込み中…");
      const merged = [];
      for(const url of CSV_URLS){
        const part = await fetchCSV(url);
        merged.push(...part);
      }
      const map = new Map();
      for(const it of merged) map.set(it.id, it);
      items = Array.from(map.values()).sort((a,b)=>a.id-b.id);

      updateStatusLine();
      renderQuestion();
    }catch(e){
      setStatus("CSV読み込み失敗：ファイル名/配置/パスを確認");
      el("prompt").textContent = "CSVの読み込みに失敗しました";
      el("choices").innerHTML = "";
      console.error(e);
    }
  })();
})();
</script>
</body>
</html>
