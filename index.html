<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>英会話用単語1000本ノック</title>
  <style>
    :root{
      --bg:#0b0f17; --card:#111827; --card2:#0f172a;
      --fg:#e5e7eb; --muted:#9ca3af; --line:rgba(255,255,255,.10);
      --accent:#22c55e; --accent2:#3b82f6; --warn:#f59e0b;
      --danger:#ef4444;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background:var(--bg);
      color:var(--fg);
      -webkit-text-size-adjust: 100%;
    }
    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 12px 24px;
    }
    .header{
      padding: 14px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .title{
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      letter-spacing: .2px;
    }
    .subrow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top: 10px;
    }
    select, button{
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--fg);
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.1;
      min-height: 42px;
    }
    select{ padding-right: 34px; }
    button{ cursor:pointer; }
    button.primary{ background:#16a34a; border-color:#16a34a; }
    button.blue{ background:#2563eb; border-color:#2563eb; }
    button.ghost{ background: transparent; }
    button.danger{ background:#b91c1c; border-color:#b91c1c; }

    .panel{
      margin-top: 12px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .label{
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .prompt{
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .2px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .choices{
      display:grid;
      gap:10px;
      margin-top: 12px;
    }
    .choice{
      width:100%;
      text-align:left;
      padding: 14px 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.25;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .choice:active{ transform: translateY(1px); }

    /* Answer box: inline (no popup), so it won't overlap on mobile */
    .answer{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
    }
    .answer .status{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 8px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 12px;
      color: var(--fg);
      white-space: nowrap;
    }
    .dot{ width:8px; height:8px; border-radius:999px; background: var(--accent2); }
    .dot.green{ background: var(--accent); }
    .dot.warn{ background: var(--warn); }

    .kv{ margin-top: 6px; line-height: 1.45; }
    .k{ color: var(--muted); font-size: 12px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    .btnrow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    .btnrow > button{ flex: 1 1 160px; }

    /* Prevent iOS bottom bar overlap */
    .safe-bottom{ padding-bottom: env(safe-area-inset-bottom); }

    .tiny{
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="wrap safe-bottom">
    <div class="header">
      <h1 class="title">英会話用単語1000本ノック</h1>

      <div class="subrow">
        <select id="mode">
          <option value="all">全体</option>
          <option value="review">要復習</option>
          <option value="unseen">未出題</option>
        </select>

        <button class="primary" id="btnNext">次の問題</button>
        <button class="blue" id="btnToggleReview" disabled>復習リストへ</button>
        <button class="ghost" id="btnClearReview">復習リスト全解除</button>
        <button class="danger" id="btnResetSeen">未出題をリセット</button>
      </div>

      <div class="tiny" id="statusText">読み込み中…（CSVは自動で読み込みます）</div>
    </div>

    <div class="panel">
      <div class="label">問題（英→日）</div>
      <div class="prompt" id="prompt">—</div>

      <div class="choices" id="choices"></div>

      <div class="answer" id="answer" style="display:none;"></div>
    </div>
  </div>

<script>
(() => {
  // ====== Settings ======
  const CSV_URLS = [
    "vocab_001_200.csv",
    "vocab_201_400.csv",
    "vocab_401_600.csv",
    "vocab_601_800.csv",
    "vocab_801_1000.csv",
  ];

  const KEY_REVIEW = "vocab_review_ids_v1"; // Set of ids (array saved)
  const KEY_SEEN   = "vocab_seen_ids_v1";   // Set of ids (array saved)

  /** @type {{id:number, expression:string, meaning:string, example_en:string, example_ja:string}[]} */
  let items = [];
  /** @type {null | {id:number, expression:string, meaning:string, example_en:string, example_ja:string}} */
  let current = null;

  const el = (id) => document.getElementById(id);

  // ====== localStorage helpers ======
  function loadSet(key){
    try{
      const arr = JSON.parse(localStorage.getItem(key) || "[]");
      return new Set(Array.isArray(arr) ? arr : []);
    }catch{ return new Set(); }
  }
  function saveSet(key, set){
    localStorage.setItem(key, JSON.stringify(Array.from(set)));
  }

  function getReviewSet(){ return loadSet(KEY_REVIEW); }
  function getSeenSet(){ return loadSet(KEY_SEEN); }

  // ====== CSV parsing (handles quotes/newlines) ======
  function parseCSV(text) {
    const rows = [];
    let i = 0, field = "", row = [];
    let inQuotes = false;

    while (i < text.length) {
      const c = text[i];

      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        } else {
          field += c; i++; continue;
        }
      } else {
        if (c === '"') { inQuotes = true; i++; continue; }
        if (c === ",") { row.push(field); field = ""; i++; continue; }
        if (c === "\r") { i++; continue; }
        if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
        field += c; i++; continue;
      }
    }
    row.push(field);
    rows.push(row);
    return rows;
  }

  function norm(h){ return (h||"").trim().toLowerCase(); }

  function rowsToItems(rows){
    if(!rows.length) return [];
    const header = rows[0].map(norm);
    const idx = {
      id: header.indexOf("id"),
      expression: header.indexOf("expression"),
      meaning: header.indexOf("meaning"),
      example_en: header.indexOf("example_en"),
      example_ja: header.indexOf("example_ja"),
    };
    for(const k in idx){
      if(idx[k] === -1) throw new Error("CSVヘッダー不足: " + k);
    }
    const out = [];
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      if(row.length === 1 && row[0].trim() === "") continue;
      const id = Number(row[idx.id]);
      if(!Number.isFinite(id)) continue;
      out.push({
        id,
        expression: (row[idx.expression] ?? "").trim(),
        meaning: (row[idx.meaning] ?? "").trim(),
        example_en: (row[idx.example_en] ?? "").trim(),
        example_ja: (row[idx.example_ja] ?? "").trim(),
      });
    }
    return out;
  }

  async function fetchCSV(url){
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error(`CSV取得失敗: ${url} (${res.status})`);
    const text = await res.text();
    return rowsToItems(parseCSV(text));
  }

  // ====== Quiz logic ======
  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildChoices(correct){
    const choices = new Set([correct.meaning]);
    while(choices.size < 4){
      const cand = items[Math.floor(Math.random()*items.length)];
      if(cand?.meaning && cand.meaning !== correct.meaning) choices.add(cand.meaning);
    }
    return shuffle(Array.from(choices));
  }

  function pickItem(){
    if(!items.length) return null;

    const mode = el("mode").value;
    const review = getReviewSet();
    const seen = getSeenSet();

    let pool = items;

    if(mode === "review"){
      pool = items.filter(x => review.has(x.id));
      if(!pool.length) return null;
    }
    if(mode === "unseen"){
      pool = items.filter(x => !seen.has(x.id));
      if(!pool.length) return null;
    }

    return pool[Math.floor(Math.random()*pool.length)];
  }

  function escapeHTML(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function refreshReviewButton(){
    const btn = el("btnToggleReview");
    if(!current){ btn.disabled = true; btn.textContent = "復習リストへ"; return; }
    btn.disabled = false;

    const review = getReviewSet();
    const inList = review.has(current.id);
    btn.textContent = inList ? "復習リストから外す" : "復習リストへ";
    btn.className = inList ? "blue" : "blue";
  }

  function setStatus(text){
    el("statusText").textContent = text;
  }

  function renderQuestion(){
    current = pickItem();
    el("answer").style.display = "none";
    el("answer").innerHTML = "";
    el("choices").innerHTML = "";

    if(!current){
      const mode = el("mode").value;
      if(mode === "review") el("prompt").textContent = "要復習が空です（『復習リストへ』で追加してください）";
      else if(mode === "unseen") el("prompt").textContent = "未出題がありません（『未出題をリセット』で戻せます）";
      else el("prompt").textContent = "出題できません";
      refreshReviewButton();
      return;
    }

    // mark seen
    const seen = getSeenSet();
    seen.add(current.id);
    saveSet(KEY_SEEN, seen);

    el("prompt").textContent = current.expression;

    const choices = buildChoices(current);
    for(const ch of choices){
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = ch;
      b.onclick = () => showAnswer(ch === current.meaning);
      el("choices").appendChild(b);
    }

    refreshReviewButton();
    updateTopStatusLine();
  }

  function showAnswer(isCorrect){
    // 正誤は「表示するだけ」に留める（進捗ロジックには使わない）
    const review = getReviewSet();
    const inList = current ? review.has(current.id) : false;

    const box = el("answer");
    box.style.display = "block";
    box.innerHTML = `
      <div class="status">
        <span class="badge"><span class="dot ${isCorrect ? "green" : "warn"}"></span>${isCorrect ? "一致" : "不一致"}</span>
        <span class="badge"><span class="dot"></span>${inList ? "要復習：ON" : "要復習：OFF"}</span>
      </div>

      <div class="kv"><span class="k">答え</span><br><b>${escapeHTML(current.expression)}</b> — ${escapeHTML(current.meaning)}</div>
      <div class="kv"><span class="k">例文（EN）</span><br>${escapeHTML(current.example_en)}</div>
      <div class="kv"><span class="k">例文（JA）</span><br>${escapeHTML(current.example_ja)}</div>
      <div class="kv k">ID: <span class="mono">${current.id}</span></div>
    `;

    // iOSで「答え表示時にズレる」対策：表示後に少しだけスクロール調整（任意）
    setTimeout(() => { box.scrollIntoView({ behavior:"smooth", block:"nearest" }); }, 50);
  }

  function toggleReview(){
    if(!current) return;
    const review = getReviewSet();
    if(review.has(current.id)) review.delete(current.id);
    else review.add(current.id);
    saveSet(KEY_REVIEW, review);
    refreshReviewButton();
    updateTopStatusLine();
  }

  function clearReview(){
    saveSet(KEY_REVIEW, new Set());
    refreshReviewButton();
    updateTopStatusLine();
  }

  function resetSeen(){
    saveSet(KEY_SEEN, new Set());
    updateTopStatusLine();
    // 未出題モードなら即反映
    if(el("mode").value === "unseen") renderQuestion();
  }

  function updateTopStatusLine(){
    const review = getReviewSet();
    const seen = getSeenSet();
    const total = items.length;
    const reviewCount = review.size;
    const unseenCount = Math.max(0, total - seen.size);
    setStatus(`読み込み: ${total} / 要復習: ${reviewCount} / 未出題: ${unseenCount}`);
  }

  // ====== UI wiring ======
  el("btnNext").onclick = renderQuestion;
  el("btnToggleReview").onclick = toggleReview;
  el("btnClearReview").onclick = () => {
    if(confirm("復習リストを全解除します。OK？")) clearReview();
  };
  el("btnResetSeen").onclick = () => {
    if(confirm("未出題（出題履歴）をリセットします。OK？")) resetSeen();
  };
  el("mode").onchange = renderQuestion;

  // ====== Boot ======
  (async () => {
    try{
      setStatus("読み込み中…");
      const merged = [];
      for(const url of CSV_URLS){
        const part = await fetchCSV(url);
        merged.push(...part);
      }
      // de-dup by id
      const map = new Map();
      for(const it of merged) map.set(it.id, it);
      items = Array.from(map.values()).sort((a,b)=>a.id-b.id);

      updateTopStatusLine();
      renderQuestion();
    }catch(e){
      setStatus("CSVが読み込めませんでした。ファイル名/配置/パスを確認してください。");
      el("prompt").textContent = "CSVの読み込みに失敗しました";
      el("choices").innerHTML = "";
      console.error(e);
    }
  })();

})();
</script>
</body>
</html>
